<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XJ MEP · 案例预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#525659; overflow:auto; }
  #viewer { max-width:900px; margin:0 auto; padding:20px; }
  
  /* PDF 页面容器 */
  .page-wrap {
    position:relative; 
    margin-bottom:16px;
    box-shadow:0 4px 16px rgba(0,0,0,.4); 
    background:#fff;
  }
  .page-wrap canvas { display:block; width:100%; height:auto; }
  
  /* 水印层 */
  .page-wrap .wm {
    position:absolute; 
    inset:0; 
    pointer-events:none;
    display:flex; 
    flex-wrap:wrap;
    justify-content:center; 
    align-items:center;
    gap:60px 80px; 
    padding:30px;
    opacity:.22; 
    transform:rotate(-25deg);
    overflow:hidden; 
    user-select:none;
  }
  .page-wrap .wm span {
    font-family:"Arial Black", Impact, sans-serif;
    font-size:2.2rem; 
    font-weight:900;
    color:#000; 
    letter-spacing:6px; 
    white-space:nowrap;
    text-shadow:0 0 2px #fff;
  }
  
  /* 加载提示 */
  #loading { 
    color:#fff; 
    text-align:center; 
    padding:40px; 
    font-family:sans-serif; 
  }
  
  /* 打印保护 */
  @media print {
    body * { display:none !important; }
    body::after {
      content:"该内容受版权保护，不支持打印。";
      display:block !important;
      font-size:24px; 
      text-align:center; 
      padding-top:100px; 
      color:#000;
    }
  }
</style>
</head>
<body>

<div id="loading">正在加载图纸…</div>
<div id="viewer"></div>

<!-- ⚠️ 注意：这里引用的是本地文件，前提是你必须把 pdf.min.js 和 pdf.worker.min.js 放在 pdfjs 文件夹里 -->
<script src="pdfjs/pdf.min.js"></script>
<script>
  // ⚠️ 本地 worker 路径
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.min.js';

  const params = new URLSearchParams(location.search);
  const fileName = params.get('file') || 'dq.pdf';
  document.title = 'XJ MEP · ' + fileName.replace(/\.pdf$/i, '');

  const viewer = document.getElementById('viewer');
  const loadingEl = document.getElementById('loading');

  // 生成水印
  function addWatermark(wrap) {
    const wm = document.createElement('div');
    wm.className = 'wm';
    for (let i = 0; i < 20; i++) {
      const s = document.createElement('span');
      s.textContent = 'XJ MEP';
      wm.appendChild(s);
    }
    wrap.appendChild(wm);
  }

  // 渲染每一页
  function renderPage(pdf, num) {
    return pdf.getPage(num).then(page => {
      const viewport = page.getViewport({ scale: 1.5 });
      const wrap = document.createElement('div');
      wrap.className = 'page-wrap';

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      wrap.appendChild(canvas);
      addWatermark(wrap);
      viewer.appendChild(wrap);

      return page.render({ canvasContext: ctx, viewport }).promise;
    });
  }

  // 加载 PDF
  pdfjsLib.getDocument(fileName).promise.then(pdf => {
    loadingEl.style.display = 'none';
    let chain = Promise.resolve();
    for (let i = 1; i <= pdf.numPages; i++) {
      chain = chain.then(() => renderPage(pdf, i));
    }
  }).catch(err => {
    loadingEl.textContent = '加载失败：' + err.message;
  });

  // 拦截右键、打印、保存
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
  
  window.print = function () { 
    alert('图纸仅供在线预览，不支持打印。'); 
  };
  
  document.addEventListener('keydown', function (e) {
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === 'p' || k === 's')) {
      e.preventDefault();
      alert('图纸仅供在线预览，不支持打印或保存。');
      return false;
    }
  });
</script>

</body>
</html>
